name: Build Cindrix AirLink (Windows + Android)

# Starts when you click GitHub > Actions > "Build Cindrix AirLink" > Run workflow,
# or whenever the branch named "build" is pushed.
# Download the results from the run page under "Artifacts". No Flutter needed on your own PC.
#
# Windows: unsigned portable zip (Windows SmartScreen will warn on first run - expected for unsigned apps).
# Android: release APKs. Without secrets they are signed with a throwaway key, which means each build
#          has a different signature and cannot update a previous install (uninstall first).
#          To get a stable key, add the repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_PASSWORD
#          (key alias must be "airlink").

on:
  workflow_dispatch:
  push:
    branches:
      - build

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7

      - name: Get version
        id: ver
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      # Required by the CMake install step (app/windows/CMakeLists.txt installs cindrix_airlink_msix_helper.msix)
      - name: Build MSIX helper
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\cindrix_airlink_msix_helper.msix

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows

      - name: Create empty settings.json (portable mode)
        working-directory: app
        run: echo {} > build/windows/x64/runner/Release/settings.json

      - name: Add Visual C++ runtime DLLs
        working-directory: app
        run: |
          Copy-Item ../support/build/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/

      # The MSIX helper only makes sense for the installer; portable users should not register an MSIX package
      - name: Remove MSIX helper from portable bundle
        working-directory: app
        run: |
          Remove-Item build/windows/x64/runner/Release/cindrix_airlink_msix_helper.msix
          Remove-Item build/windows/x64/runner/Release/install_msix_helper.ps1
          Remove-Item build/windows/x64/runner/Release/cindrix_airlink.exe.manifest

      # No zip step: GitHub already zips the artifact, so the download is a single zip with the app files at its root.
      - uses: actions/upload-artifact@v6
        with:
          name: CindrixAirLink-${{ steps.ver.outputs.version }}-windows-x86-64
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up disk space
        run: |
          # The Rust networking library needs a lot of disk; remove big tools this build does not use
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images /opt/ghc /usr/local/share/boost /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean || true
          df -h /
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal

      # Signing key, in order of preference:
      #   1. repository secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEY_PASSWORD
      #   2. the fixed key committed in signing/, but ONLY while this repository is private
      #   3. a throwaway key (updates then require uninstalling the old app first)
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Using signing key from repository secrets"
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks/airlink.jks"
            PASS="$KEY_PASSWORD"
            cat > app/android/key.properties <<EOF
          storePassword=$PASS
          keyPassword=$PASS
          keyAlias=airlink
          storeFile=$RUNNER_TEMP/ks/airlink.jks
          EOF
          elif [ -f signing/airlink.jks ] && [ -f signing/key.properties ] && [ "$REPO_PRIVATE" = "true" ]; then
            echo "Using fixed signing key from signing/ (repository is private)"
            cp signing/key.properties app/android/key.properties
            sed -i "s#^storeFile=.*#storeFile=$GITHUB_WORKSPACE/signing/airlink.jks#" app/android/key.properties
          else
            echo "::warning::No usable fixed key (secrets missing, and the repository is not private or signing/ is absent). Signing with a throwaway key; uninstall the old app before installing this APK."
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks/airlink.jks" -alias airlink -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Cindrix AirLink, O=Cindrix"
            cat > app/android/key.properties <<EOF
          storePassword=$PASS
          keyPassword=$PASS
          keyAlias=airlink
          storeFile=$RUNNER_TEMP/ks/airlink.jks
          EOF
          fi

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APKs
        working-directory: app
        run: flutter build apk --split-per-abi --target-platform android-arm64

      - uses: actions/upload-artifact@v6
        with:
          name: CindrixAirLink-android-apks
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
