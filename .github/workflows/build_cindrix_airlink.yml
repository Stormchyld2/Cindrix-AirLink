name: Build Cindrix AirLink (Windows + Android)

# Starts when you click GitHub > Actions > "Build Cindrix AirLink" > Run workflow,
# or whenever the branch named "build" is pushed.
# Download the results from the run page under "Artifacts". No Flutter needed on your own PC.
#
# Windows: unsigned portable zip (Windows SmartScreen will warn on first run - expected for unsigned apps).
# Android: release APKs. Without secrets they are signed with a throwaway key, which means each build
#          has a different signature and cannot update a previous install (uninstall first).
#          To get a stable key, add the repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_PASSWORD
#          (key alias must be "airlink").

# Private repos get a limited number of free build minutes and Windows costs double, so a push to "build"
# only builds Android. "Run workflow" lets you pick Windows, Android, or both.
#
# Android builds two products from one codebase (see ARCHITECTURE.md 5.5): plain AirLink and AirLink Pro.
# "Run workflow" lets you pick either or both. A push to "build" builds both by default, unless you set the
# repository variable AIRLINK_FLAVOR to "free" or "pro" (Settings > Secrets and variables > Actions > Variables)
# to build only the one you're currently working on - cuts Android build time roughly in half.
on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Build Windows"
        type: boolean
        default: true
      android:
        description: "Build Android"
        type: boolean
        default: true
      android_free:
        description: "Android: build plain AirLink"
        type: boolean
        default: true
      android_pro:
        description: "Android: build AirLink Pro"
        type: boolean
        default: true
  push:
    branches:
      - build

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows }}
    runs-on: windows-latest
    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v6

      - name: Get version
        id: ver
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      # Required by the CMake install step (app/windows/CMakeLists.txt installs cindrix_airlink_msix_helper.msix)
      - name: Build MSIX helper
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\cindrix_airlink_msix_helper.msix

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows

      - name: Create empty settings.json (portable mode)
        working-directory: app
        run: echo {} > build/windows/x64/runner/Release/settings.json

      - name: Add Visual C++ runtime DLLs
        working-directory: app
        run: |
          Copy-Item ../support/build/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/

      # The MSIX helper only makes sense for the installer; portable users should not register an MSIX package
      - name: Remove MSIX helper from portable bundle
        working-directory: app
        run: |
          Remove-Item build/windows/x64/runner/Release/cindrix_airlink_msix_helper.msix
          Remove-Item build/windows/x64/runner/Release/install_msix_helper.ps1
          Remove-Item build/windows/x64/runner/Release/cindrix_airlink.exe.manifest

      # No zip step: GitHub already zips the artifact, so the download is a single zip with the app files at its root.
      - uses: actions/upload-artifact@v6
        with:
          name: CindrixAirLink-${{ steps.ver.outputs.version }}-windows-x86-64
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error

  android:
    if: ${{ github.event_name == 'push' || inputs.android }}
    runs-on: ubuntu-22.04
    steps:
      - name: Free up disk space
        run: |
          # The Rust networking library needs a lot of disk; remove big tools this build does not use
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/system-images /opt/ghc /usr/local/share/boost /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean || true
          df -h /
      - uses: actions/checkout@v6

      - name: Decide which Android flavors to build
        id: flavors
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FREE="${{ inputs.android_free }}"
            PRO="${{ inputs.android_pro }}"
          else
            case "${{ vars.AIRLINK_FLAVOR }}" in
              free) FREE=true; PRO=false ;;
              pro) FREE=false; PRO=true ;;
              *) FREE=true; PRO=true ;;
            esac
          fi
          echo "free=$FREE" >> "$GITHUB_OUTPUT"
          echo "pro=$PRO" >> "$GITHUB_OUTPUT"
          echo "Building: free=$FREE pro=$PRO"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal

      # Signing key, in order of preference:
      #   1. repository secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEY_PASSWORD
      #   2. the fixed key committed in signing/, but ONLY while this repository is private
      #   3. a throwaway key (updates then require uninstalling the old app first)
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # One permanent key for every build, so each APK installs over the previous one.
          # No fallback key on purpose: a build signed with a different key could not update the installed app.
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing repository secrets ANDROID_KEYSTORE_BASE64 and/or ANDROID_KEY_PASSWORD. Add them under Settings > Secrets and variables > Actions, then run again."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ks"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks/airlink.jks"
          cat > app/android/key.properties <<EOF
          storePassword=$KEY_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=airlink
          storeFile=$RUNNER_TEMP/ks/airlink.jks
          EOF

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      # Two products from one codebase: plain AirLink (file transfer only) and AirLink Pro (adds Comms).
      # Each is its own Android product flavor (app/android/app/build.gradle), so they install side by side
      # (different applicationId). steps.flavors above decides which (or both) to actually build.
      - name: Build free APK
        if: steps.flavors.outputs.free == 'true'
        working-directory: app
        run: flutter build apk --flavor free --dart-define=TIER=free --split-per-abi --target-platform android-arm64

      - name: Build Pro APK
        if: steps.flavors.outputs.pro == 'true'
        working-directory: app
        run: flutter build apk --flavor pro --dart-define=TIER=pro --split-per-abi --target-platform android-arm64

      - name: Name the APKs
        id: apk
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.flavors.outputs.free }}" = "true" ]; then
            NAME="app-airlink-${VERSION}-release.apk"
            cp "app/build/app/outputs/flutter-apk/app-arm64-v8a-free-release.apk" "app/build/app/outputs/flutter-apk/${NAME}"
            echo "free_path=app/build/app/outputs/flutter-apk/${NAME}" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ steps.flavors.outputs.pro }}" = "true" ]; then
            NAME="app-airlink-pro-${VERSION}-release.apk"
            cp "app/build/app/outputs/flutter-apk/app-arm64-v8a-pro-release.apk" "app/build/app/outputs/flutter-apk/${NAME}"
            echo "pro_path=app/build/app/outputs/flutter-apk/${NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v6
        if: steps.flavors.outputs.free == 'true'
        with:
          name: CindrixAirLink-${{ steps.apk.outputs.version }}-android
          path: ${{ steps.apk.outputs.free_path }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: steps.flavors.outputs.pro == 'true'
        with:
          name: CindrixAirLinkPro-${{ steps.apk.outputs.version }}-android
          path: ${{ steps.apk.outputs.pro_path }}
          if-no-files-found: error
